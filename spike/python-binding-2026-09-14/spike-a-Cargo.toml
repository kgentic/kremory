[package]
name = "kremory_py_spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.86"

[lib]
name = "kremory_py_spike"
crate-type = ["cdylib"]

[dependencies]
kremory = { path = "crates/kremory" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
tempfile = "3"

[workspace]
