[workspace]
resolver = "2"
members = [
    "crates/kremory",
    "crates/kremory-eval",
    "crates/kremory-admin",
    "crates/kremory-napi",
    # MUST stay a member — excluding it rots the crate against facade drift
    # (10 compile errors accrued invisibly while excluded, 2026-07-13). Workspace
    # membership is the structural anti-rot fix — same failure class as the ner
    # ingest() drop. See kremory-mcp-rewrite-0.4.0 spec §1 + R7. Do NOT re-exclude.
    "crates/kremory-mcp",
]

[workspace.package]
# MSRV floor — required for native AFIT dyn-compat per ADR-040.
# Cycle-3 dual-trait pattern (EntityExtractor + EntityExtractorDyn + blanket
# impl) is built on Rust 1.86's AFIT in trait stabilisation. Individual crates
# may declare a HIGHER MSRV but never lower than this floor.
rust-version = "1.86"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Faster incremental builds during Ralph Loop iteration. v0.1.0 publish uses
# `--release` regardless; dev profile optimisations don't affect crates.io.
opt-level = 0
debug = 1

# Option-1 (2026-06-23): the `[patch.crates-io]` redirect of `autoagents-llm` to
# upstream `main` has been REMOVED. kremory no longer depends on the unreleased
# `ChatProvider::model()` accessor (PR #237) — the model string is now consumer-
# supplied data threaded from the builder (see the Option-1 integration-points
# doc). kremory therefore builds against published `autoagents-llm 0.3.7`, the
# patch is gone, and `cargo publish` is unblocked.
#
# Known 0.3.7 limitation: Anthropic native structured output (`output_config`,
# PR #236) is not in 0.3.7 — Anthropic falls back to the prompt-only ladder.
# Ollama (the primary/tested path) is unaffected. Re-evaluate if/when upstream
# cuts a release > 0.3.7 carrying PR #236 (additive — does NOT reintroduce the
# `model()` dependency).
