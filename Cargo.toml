[workspace]
resolver = "2"
members = ["crates/kremory", "crates/kremory-eval", "crates/kremory-admin", "crates/kremory-napi"]

# kremory-mcp excluded until D.4b handler bodies land.
# Per ADR-Phase-D.0 §"rqlm-mcp tool surface": D.4 ships scaffold only with
# "pending D.4b" stubs. Re-add to members list at D.4b.
exclude = [
    "crates/kremory-mcp",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Faster incremental builds during Ralph Loop iteration. v0.1.0 publish uses
# `--release` regardless; dev profile optimisations don't affect crates.io.
opt-level = 0
debug = 1

# Redirect all autoagents-llm 0.3.x deps (including transitive via
# autoagents-llamacpp) to the kgentic fork branch that carries:
#   - Anthropic output_config wire-up
#   - ChatProvider::model() accessor (PR #237 upstream, pending merge)
#
# Git source (not local path) so CI containers resolve without filesystem
# dependency. Remove once upstream merges + releases a pinned version.
# Blocks cargo publish.
[patch.crates-io]
autoagents-llm = { git = "https://github.com/kgentic/AutoAgents.git", branch = "feat/chat-provider-model-accessor" }
