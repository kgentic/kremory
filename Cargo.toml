[workspace]
resolver = "2"
members = ["crates/kremory", "crates/kremory-eval", "crates/kremory-admin", "crates/kremory-napi"]

# kremory-mcp excluded until D.4b handler bodies land.
# Per ADR-Phase-D.0 §"rqlm-mcp tool surface": D.4 ships scaffold only with
# "pending D.4b" stubs. Re-add to members list at D.4b.
exclude = [
    "crates/kremory-mcp",
]

[workspace.package]
# MSRV floor — required for native AFIT dyn-compat per ADR-040.
# Cycle-3 dual-trait pattern (EntityExtractor + EntityExtractorDyn + blanket
# impl) is built on Rust 1.86's AFIT in trait stabilisation. Individual crates
# may declare a HIGHER MSRV but never lower than this floor.
rust-version = "1.86"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# Faster incremental builds during Ralph Loop iteration. v0.1.0 publish uses
# `--release` regardless; dev profile optimisations don't affect crates.io.
opt-level = 0
debug = 1

# Redirect all autoagents-llm 0.3.x deps (including transitive via
# autoagents-llamacpp) to upstream main, which now carries:
#   - Anthropic output_config wire-up (PR #236, merged 2026-06-03)
#   - ChatProvider::model() accessor (PR #237, merged 2026-06-04)
#
# Git source (not crates.io) because upstream has not yet cut a release
# containing these merges (crates.io max = 0.3.7, 2026-03-25). Remove once
# upstream publishes a version > 0.3.7 that includes both PRs.
# Blocks cargo publish.
[patch.crates-io]
autoagents-llm = { git = "https://github.com/liquidos-ai/AutoAgents.git", branch = "main" }
