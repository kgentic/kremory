# nextest configuration for kremory. See TD-109 +
# .ai-docs/specs/test-suite-build-perf-spec-2026-07-09.md
#
# `cargo nextest run -p kremory` is the recommended local test runner:
# ~16x faster than `cargo test` (measured 568s -> 35s, single-run) because it
# runs all test binaries in one global parallel pool instead of serially.
#
# IMPORTANT: nextest does NOT run doctests. Run them separately:
#     cargo test --doc -p kremory

[profile.default]
# Surface (do not kill) any test slower than 60s — an early warning for the
# hung-test / machine-sleep-stall class. Nothing in the default feature set
# exceeds ~10s today.
slow-timeout = "60s"

# --- Serial group for background/async-timing integration tests (TD-091 fix) ---
# ACTIVATED 2026-07-17 (was the RISK-002 scaffold). Cause: these integration
# tests wait for deferred extraction / sink firing within a fixed timeout. Under
# nextest's full parallel pool (1500+ tests across --all-features) on a loaded
# machine they get CPU-starved and miss the timeout. This is a HARNESS
# parallelism issue, NOT a correctness bug — the 5 observed failures
# (add_episode_returns_before_gliner_fires, deferred_extraction_invoked_after_
# successful_ner, sink_send_batched_fires_on_batch_phase2_complete,
# sink_send_batched_two_batches_fire_independently,
# sink_batch_complete_fires_when_all_terminal) ALL pass serially even under load
# 18-20 (verified 2026-07-17). Serializing the resource-touching binaries keeps
# the timing assertions intact + un-starved. Adding the sibling background/
# concurrent-spike binaries pre-empts the same class.
[test-groups]
serial-resource = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/adr051_gliner_to_background|background_integration|sink_wiring_integration|spike_background_plus_engine_handle_concurrent|spike_two_engine_concurrent|wait_for_processing/)'
test-group = 'serial-resource'
