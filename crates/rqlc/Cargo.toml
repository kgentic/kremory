[package]
name = "rql-core"
version = "0.1.0"
edition = "2021"

[features]
ner = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub"]
# BYOM invariant (ADR-Phase-D.0 §7): rqlc consumes the trait crate
# (autoagents-llm) ONLY — never the concrete `autoagents-llamacpp` impl,
# neither in [dependencies] nor [dev-dependencies]. `cargo tree -p
# rql-core | grep autoagents-llamacpp` MUST print empty. The concrete
# impl lives in rust-pipeline / tauri-app where the the host application binary
# co-locates LlamaCppClient + synthesis::autoagents. Real-model smoke
# tests live in `rust-pipeline/tests/llamacpp_smoke.rs` (moved out per
# Vera D.1a cycle-1 MEDIUM-1).
llm = ["dep:autoagents-llm", "dep:futures"]
embeddings = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub"]
test-utils = []

# The `rql-core` CLI binary (`main.rs`) was deleted in D.1a per ADR-Phase-D.0
# §11: not consumer-facing, not part of the public API surface, and the BYOM
# removal of `autoagents-llamacpp` from production deps broke its provider
# construction. If a dev CLI is needed later, add as `bin/cli.rs` with
# `required-features = ["llm"]` and document as dev-only.

[lib]
name = "rql_core"
path = "lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.7"
# libSQL: native vectors (F32_BLOB + DiskANN) + FTS5 + SQL. Replaces rusqlite + sqlite-vec.
libsql = "*"
autoagents-llm = { path = "../../../oss/AutoAgents/crates/autoagents-llm", optional = true }
futures = { version = "0.3", optional = true }
async-trait = "0.1"
llm_json = "1.0.3"
metrics = "0.24"
tracing = "0.1"
zspell = "0.5"
stop-words = "0.8"
unicode-segmentation = "1.11"
ort = { version = "=2.0.0-rc.12", features = ["ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "*", optional = true }
hf-hub = { version = "*", optional = true }

[dev-dependencies]
metrics-util = "0.18"
tokio = { version = "1", features = ["full", "test-util"] }
zspell = "0.5"
stop-words = "0.8"
unicode-segmentation = "1.11"
# BYOM invariant (ADR-Phase-D.0 §7): rql-core MUST NOT depend on
# `autoagents-llamacpp` — neither as a production dep nor as a dev-dep —
# because `cargo tree -p rql-core | grep autoagents-llamacpp` must print
# empty. The concrete `LlamaCppProvider` smoke tests that previously
# lived in `provider.rs::tests::llm_smoke` were relocated to
# `rust-pipeline/tests/llamacpp_smoke.rs` per Vera D.1a cycle-1 MEDIUM-1.
# The trait surface (`autoagents-llm`) is the only LLM crate rql-core
# touches; downstream consumers wire the concrete impl.
autoagents-llm = { path = "../../../oss/AutoAgents/crates/autoagents-llm" }
anyhow = "1"
