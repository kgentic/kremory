[package]
name = "rql-memory"
version = "0.1.0"
edition = "2021"

# rqlm — Zep-equivalent orchestration layer over rqlc (Graphiti-equivalent).
#
# Per ADR-Phase-D.0 (.ai-docs/adrs/adr--phase-d0-rqlcm-design-lock-2026-05-18.md):
# rqlm is GREENFIELD — 4 public async functions + scoping types that wrap
# rqlc's `add_episode`-cycle primitives. NO per-episode work lives here;
# all extraction / contradiction / dedup / fact-invalidation is rqlc.
#
# BYOM invariant (ADR-Phase-D.0 §7): rqlm consumes the `ChatProvider`
# trait from `autoagents-llm` only — NEVER the concrete `autoagents-llamacpp`
# impl. Consumers (the host application, paying SDK customers) wire their own backend.

[lib]
name = "rql_memory"
path = "src/lib.rs"

[dependencies]
# Enable rqlc's `llm` feature so the canonical autoagents-llm trait
# re-exports (rql_core::provider::ChatProvider = autoagents_llm::chat::ChatProvider)
# are compiled and `MockChatProvider` impls the canonical trait. Without
# this feature, rqlc falls back to a stub `ChatProvider` trait for
# no-llm builds — fine for rqlc alone, but rqlm consumers need the
# canonical surface for BYOM contract compatibility.
rql-core = { path = "../rqlc", features = ["llm"] }
autoagents-llm = { path = "../../../oss/AutoAgents/crates/autoagents-llm" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
anyhow = "1"
