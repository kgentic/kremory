[package]
name = "rqlm-mcp"
version = "0.1.0"
edition = "2021"

# rqlm-mcp — MCP server crate wrapping rqlm's 4 public entry points as
# JSON-RPC tools over rmcp stdio transport.
#
# Per ADR-Phase-D.0 §"rqlm-mcp tool surface" + master plan §3 D.4: this
# crate is the bridge between MCP clients (e.g. aidocs in
# kgentic-marketplace) and the rqlm SDK. Lives in this workspace because
# it depends on path = "../rqlm".
#
# D.4 (this slice) ships the SCAFFOLD: tool registration, JSON parameter
# shapes, error contract pins. Handler BODIES return "pending D.4b" errors
# until rqlm's D.2b lands the real RqlGraph<L, Emb> wiring.

[lib]
name = "rqlm_mcp"
path = "src/lib.rs"

[[bin]]
name = "rqlm-mcp-server"
path = "src/main.rs"

[dependencies]
rql-memory = { path = "../rqlm" }
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# rql-core is consumed by rqlm transitively; we add it as an explicit
# dev-dep here so the integration tests can construct
# `MockChatProvider::null()` for the bound-server tests. Production
# binary + library stay free of this direct dep (BYOM contract: consumers
# wire their own backend).
rql-core = { path = "../rqlc", features = ["llm"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
