[package]
name = "kremory-mcp"
version = "0.1.0"
edition = "2021"

# kremory-mcp — MCP server crate wrapping kremory::memory's 4 public entry
# points as JSON-RPC tools over rmcp stdio transport.
#
# Per ADR-Phase-D.0 §"rqlm-mcp tool surface" + master plan §3 D.4: this
# crate is the bridge between MCP clients (e.g. aidocs in
# kgentic-marketplace) and the kremory SDK.
#
# STATUS (verified 2026-06-21 — see TD-048): the 4 tool handlers
# (kremory_ingest_episode / kremory_run_dream_phase / kremory_search /
# kremory_context_block) are FULLY WIRED to real kremory::memory functions —
# NOT "pending D.4b" stubs (the earlier comment here was stale doc-rot).
#
# It does NOT build while workspace-EXCLUDED: Cargo `[patch.crates-io]`
# (root Cargo.toml redirects autoagents-llm → git AutoAgents@main, which carries
# ChatProvider::model()) applies ONLY to the workspace it is declared in.
# Excluded → this crate resolves crates.io autoagents-llm 0.3.7 (no .model())
# → `kremory` lib fails to compile (E0599/E0407, 25 errors). The remaining
# "D.4b" work is therefore a workspace-MEMBERSHIP step, not handler work:
# re-add `crates/kremory-mcp` to root `members` so it inherits the patch +
# shared lock, then run /quality-gate. (SamplingChatProvider / harness-sampled
# mode lands here too — see adr-harness-sampled-llm-via-mcp-sampling.)

[lib]
name = "kremory_mcp"
path = "src/lib.rs"

[[bin]]
name = "kremory-mcp-server"
path = "src/main.rs"

[dependencies]
kremory = { path = "../kremory" }
rmcp = { version = "1.5", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# kremory bundles core + memory in one crate; MockChatProvider::null() is
# available from kremory::core::provider for integration tests.
# autoagents-llm is a required kremory dep (not optional), so no extra feature flag needed.
kremory = { path = "../kremory" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
