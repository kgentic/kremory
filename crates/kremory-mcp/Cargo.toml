[package]
name = "kremory-mcp"
version = "0.1.0"
edition = "2021"

# kremory-mcp — MCP server crate wrapping kremory's 0.4.0 `Memory` facade as 5
# JSON-RPC tools (kremory_remember / kremory_recall / kremory_dream /
# kremory_list_mutations / kremory_undo) over rmcp stdio transport.
#
# STATUS (rewritten 2026-07-14 — see kremory-mcp-rewrite-0.4.0 spec): the prior
# 4-tool surface (kremory_ingest_episode / kremory_run_dream_phase /
# kremory_search / kremory_context_block) wrapped the deprecated
# kremory::memory free-function API and the retired `WorkspaceScope` type.
# Rewritten onto the floor-3 tool surface over `kremory::Memory` — always
# bound (no more Option<ServerState> / "graph not bound" ceremony), namespace +
# thread scoping, hybrid recall as the single search tool. G3 (2026-07-14)
# closed the reversible-mutations gap: floor-3 → floor-5 with
# kremory_list_mutations (SEE) + kremory_undo (unified FIX dispatcher).

[features]
default = []
# content-search: passthrough to kremory's ADR-072 seq1 BM25/FTS5 content
# recall (`mem.recall(q).content()` -> `ContentPassage`). Wires
# `GET /search?mode=content|hybrid` on the `kremory-http` REST bin
# (benchmark-completion-roadmap W0.1) — `mode=recall` (the default) is
# byte-identical whether or not this is enabled. Off by default; enabling it
# costs nothing at ingest time (Migration 022 backfills `episodes_fts` from
# already-stored `episodes.content` via pure SQL — no LLM/embedding re-ingest).
content-search = ["kremory/content-search"]
# prometheus: install a Prometheus PULL recorder + expose `GET /metrics` on the
# `kremory-http` bin (executes ratified ADR-D2 — the CONSUMER binary owns the
# recorder; the `kremory` lib never installs one). OPT-IN + off by default
# because the sibling `kremory-mcp-server` (stdio) bin CANNOT use a pull exporter
# (stdout is reserved for JSON-RPC — a scrape/OTLP-push split per R1). Enable for
# the HTTP/bench build: `--features prometheus,content-search`.
prometheus = ["dep:metrics-exporter-prometheus"]

[lib]
name = "kremory_mcp"
path = "src/lib.rs"

[[bin]]
name = "kremory-mcp-server"
path = "src/main.rs"

# `kremory-http` — thin REST transport reusing the SAME `handlers.rs` bodies
# the MCP stdio server (`kremory-mcp-server`, above) calls into. One Rust SDK
# (`kremory::Memory`), two thin transports — see `src/handlers.rs` module
# docs. Lets a non-MCP harness (e.g. a Python benchmark) drive kremory over
# plain HTTP.
[[bin]]
name = "kremory-http"
path = "src/bin/kremory-http.rs"

[dependencies]
kremory = { path = "../kremory" }
# Pinned to 1.8 floor: compile-spike (2026-07-14, spec §7 step 0 / R9) resolved
# 1.8.0 from the old "1.5" caret and verified the #[tool_router]/#[tool] macro
# API is unchanged. Floor raised to the verified version to prevent a silent
# downgrade to an untested 1.5.x given MCP 2026-07-28 spec churn.
rmcp = { version = "1.8", features = ["server", "transport-io", "macros"] }
# "net" + "time" added for main.rs's own Ollama-reachability health check
# (kremory's `with_ollama_at`/`with_ollama_at_model` do NOT probe reachability
# at construction time — first LLM call errors instead. "Fail fast and loud"
# requires main.rs to check this itself before serving).
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "net", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1.2"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
# Pinned to match kremory's own `metrics = "0.24"` (facade/mod.rs DreamSummary
# doc: consumers reading kremory's counters must pin the same minor version).
metrics = "0.24"
uuid = { version = "1", features = ["v4"] }
# `kremory-http` bin only — REST transport for non-MCP consumers (e.g. the
# Python benchmark harness). No other crate in the workspace depends on
# these; fresh additions.
axum = "0.8"
tower-http = { version = "0.6", features = ["trace"] }
metrics-exporter-prometheus = { version = "0.18.3", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
# kremory bundles core + memory in one crate; MockChatProvider::null() /
# NullEmbeddingProvider are used by the in-process handler_roundtrip tests.
# `test-utils` is required — MockChatProvider is `#[cfg(any(test, feature =
# "test-utils"))]` inside kremory, and `cfg(test)` there only fires for
# kremory's OWN unit tests, not an external consumer crate's tests.
kremory = { path = "../kremory", features = ["test-utils"] }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
# Subprocess JSON-RPC test client (tests/subprocess_jsonrpc.rs) — spawns the
# real binary and speaks MCP over its stdio via rmcp's own client transport.
rmcp = { version = "1.8", features = ["client", "transport-child-process"] }
anyhow = "1"
# `kremory-http` bin test module only — `ServiceExt::oneshot` to drive the
# axum Router in-process without binding a TCP listener.
tower = { version = "0.5", features = ["util"] }
