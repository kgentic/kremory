# TD-042 Tier 3 (2026-06-19): lowered 5 -> 3 — functions with >3 args must use
# an args-as-object params struct (rust-conventions §too_many_arguments). No blind
# #[allow] in src/ (CLAUDE.md Rule 8). Test helpers may carry a documented allow.
too-many-arguments-threshold = 3

# TD-002: module-size lint (Foundation Sprint Phase C, 2026-06-08)
#
# Threshold rationale (originally measured post-E0 split, 2026-06-08):
#   graph.rs       = 3142 LoC  → SPLIT into core/graph/ module (TD-045 Wave 2, 2026-06-18)
#   migrations.rs  = 2295 LoC  → SPLIT into migrations/ module (TD-045 Wave 1, 2026-06-18)
#   search.rs      = 1935 LoC  (search + recall + embedding similarity — distinct concerns
#                               consolidated for single-pass query construction; now largest)
#
# Setting 3500 keeps headroom over the current largest file (search.rs ~1935 LoC)
# while catching any NEW file that balloons past ~3500 LoC without a deliberate split.
# Any file that legitimately exceeds the threshold must carry an inline
# `#[allow(clippy::too_many_lines)]` with a comment explaining why the exception is valid
# per CLAUDE.md Rule 8 (no blind suppression).
too-many-lines-threshold = 3500
