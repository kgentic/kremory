# kremory provider rates — canonical cost table (ADR D9 / v0.1.2)
#
# Used by `TokenTrackingChatProvider` and `TokenTrackingEmbedder` to compute
# cost estimates from `kremory_core_tokens_total` counter data.
#
# `cost_per_1k_tokens_usd`: USD cost per 1000 tokens.
# For chat models: the OUTPUT rate is used (more conservative / expensive estimate).
#   v0.1.3 may add per-direction granularity if needed.
# For embedding models: single rate (no input/output distinction).
#
# Update this file when providers publish new pricing. Include a reference link.
#
# ADR D7 cardinality discipline:
#   `provider` and `model` label values in metrics MUST match the keys here.
#   Unlisted provider/model combos will not produce cost estimates in dashboards.
#
# There is NO `direction` field — single rate per model per spec line 196 + 458.

rates_as_of = "2026-05-27"

# ── OpenAI embeddings ─────────────────────────────────────────────────────────
# Source: https://openai.com/pricing (accessed 2026-05-27)

[[providers]]
provider = "openai"
model    = "text-embedding-3-small"
cost_per_1k_tokens_usd = 0.00002
dimensions = 1536

[[providers]]
provider = "openai"
model    = "text-embedding-3-large"
cost_per_1k_tokens_usd = 0.00013
dimensions = 3072

[[providers]]
provider = "openai"
model    = "text-embedding-ada-002"
cost_per_1k_tokens_usd = 0.00010
dimensions = 1536

# ── VoyageAI embeddings ───────────────────────────────────────────────────────
# Source: https://www.voyageai.com/pricing (accessed 2026-05-27)

[[providers]]
provider = "voyage"
model    = "voyage-3"
cost_per_1k_tokens_usd = 0.00006
dimensions = 1024

[[providers]]
provider = "voyage"
model    = "voyage-3-lite"
cost_per_1k_tokens_usd = 0.00002
dimensions = 512

[[providers]]
provider = "voyage"
model    = "voyage-code-3"
cost_per_1k_tokens_usd = 0.00006
dimensions = 1024

# ── Local / self-hosted embeddings ────────────────────────────────────────────
# Zero cost — CPU/GPU amortised separately via infra cost accounting.

[[providers]]
provider = "local"
model    = "all-minilm-l6-v2"
cost_per_1k_tokens_usd = 0.0
dimensions = 384

[[providers]]
provider = "local"
model    = "nomic-embed-text-v1.5"
cost_per_1k_tokens_usd = 0.0
dimensions = 768

# ── OpenAI chat ───────────────────────────────────────────────────────────────
# Source: https://openai.com/pricing (accessed 2026-05-27)
# Using output rate (more conservative). v0.1.3 may add per-direction granularity.
# gpt-4o-mini: $0.60 per MTok output → $0.0006 per 1k
# gpt-4o: $10 per MTok output → $0.01 per 1k

[[providers]]
provider = "openai"
model    = "gpt-4o-mini"
cost_per_1k_tokens_usd = 0.0006

[[providers]]
provider = "openai"
model    = "gpt-4o"
cost_per_1k_tokens_usd = 0.01

# ── Anthropic chat ────────────────────────────────────────────────────────────
# Source: https://platform.claude.com/docs/en/docs/about-claude/models/overview
# (accessed 2026-05-27)
# Using output rate (more conservative). v0.1.3 may add per-direction granularity.
# claude-haiku-4-5: $5 per MTok output → $0.005 per 1k
# claude-sonnet-4-6: $15 per MTok output → $0.015 per 1k

[[providers]]
provider = "anthropic"
model    = "claude-haiku-4-5"
cost_per_1k_tokens_usd = 0.005

[[providers]]
provider = "anthropic"
model    = "claude-sonnet-4-6"
cost_per_1k_tokens_usd = 0.015

# ── Groq (OpenAI-compatible) chat ─────────────────────────────────────────────
# Source: https://groq.com/pricing (accessed 2026-07-20). gpt-oss-120b:
# $0.15/MTok input, ~$0.60/MTok output → using output rate (conservative, per the
# table convention) = $0.0006 per 1k. `model` matches the id Groq exposes (the
# same string threaded as the metric `model` label). NOTE: single-rate is a known
# imprecision (input is ~4× cheaper); per-direction rates tracked as a follow-up.
[[providers]]
provider = "groq"
model    = "openai/gpt-oss-120b"
cost_per_1k_tokens_usd = 0.0006

# ── Ollama / local chat ───────────────────────────────────────────────────────
# Self-hosted, no provider cost. Wildcard model matches any Ollama model.

[[providers]]
provider = "ollama"
model    = "*"
cost_per_1k_tokens_usd = 0.0
