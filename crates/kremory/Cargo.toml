[package]
name = "kremory"
version = "0.8.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Bi-temporal knowledge graph engine + agent memory orchestration in pure Rust"
repository = "https://github.com/kgentic/kremory"
# kremory.dev IS registered (2026-05-21, expires 2027-05-21) and delegated to
# Cloudflare nameservers, but publishes no A/AAAA record, so it resolves
# nowhere (verified 2026-09-05 against a control host that resolved fine).
# The fix is therefore adding a record, not acquiring a domain. A dead
# `homepage` puts a broken link on the crates.io page, so this points at the
# repository until something is actually served there.
homepage = "https://github.com/kgentic/kremory"
readme = "README.md"
keywords = ["agent", "memory", "knowledge-graph", "bi-temporal", "embedding"]
categories = ["database", "data-structures"]
# Allowlist what ships to crates.io — keeps internal .ai-docs/, logs/, tests/,
# examples/, monitoring/* (except the include_str! rates asset), etc. OUT of the
# published package (0.3.0 shipped ~181 internal files for lack of this).
# `monitoring/provider-rates.toml` is a COMPILE-TIME asset (core/rates.rs include_str!).
include = [
    "src/**/*.rs",
    "monitoring/provider-rates.toml",
    "README.md",
    "CHANGELOG.md",
    "Cargo.toml",
    # Apache-2.0 s4(a) requires the License accompany any redistribution.
    # Both are symlinks to the workspace root; `cargo package` resolves
    # symlinks (proven: the README symlink shipped its target in 0.7.0).
    # Omitting these shipped 0.7.0 without a licence file.
    "LICENSE",
    "NOTICE",
    # NAMED examples only — never `examples/**`. The exclusion above exists because
    # 0.3.0 shipped ~181 internal files; `alias_probe.rs` and `graph_health.rs` are
    # internal diagnostics and MUST stay out.
    "examples/offline_remember_recall.rs",
    "examples/remembers_across_sessions.rs",
    "examples/agent_memory_with_ollama.rs",
]

# docs.rs builds the public API surface with all stable features + the docsrs cfg
# so feature-gated items (otel, ner) render. Excludes unstable surfaces by design.
[package.metadata.docs.rs]
features = ["otel"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Narrow, explicit default — still prevents `--all-features` CI builds from
# silently enabling unstable surfaces (consumers must opt-in to unstable-graph /
# unstable-tags), but is no longer EMPTY.
#
# ADR-078 (2026-07-28): `content-search` was promoted here after the first direct
# measurement of the actual default build. An empty default is only a safe default
# when the omitted features are optional EXTRAS; `content-search` is not — it gates
# the BM25 arm, the dense arm, and Migrations 022 + 026, i.e. essentially all
# measured recall quality (-32.2pt without it). `rerank` deliberately stays opt-in:
# it pulls `ort`/ONNX Runtime, a dependency imposition a memory library should not
# make for every consumer.
default = ["content-search"]
ner = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub"]
# BYOM invariant: kremory consumes the trait crate (autoagents-llm) ONLY —
# never the concrete `autoagents-llamacpp` impl, neither in [dependencies] nor
# [dev-dependencies]. `cargo tree -p kremory | grep autoagents-llamacpp` MUST
# print empty. The concrete impl lives in the downstream host application that
# co-locates its LLM client with its synthesis layer.
# autoagents-llm is a REQUIRED dep (not optional) because kremory::memory's
# GraphHandle trait surface always needs ChatProvider.
embeddings = ["dep:ort", "dep:ndarray", "dep:tokenizers", "dep:hf-hub"]
test-utils = []
# trace: RESERVED, NOT YET WIRED. Intended to gate hot-path span emission
# (ADR D3) so production throughput overhead stays near zero on non-OTel
# deployments. As of 0.5.0 no source in this crate is `#[cfg(feature =
# "trace")]` — enabling it is currently a no-op. Kept as a placeholder so the
# eventual wiring is additive, not a new feature name.
trace = []
# otel: wire tracing-opentelemetry + opentelemetry_sdk so spans export via OTLP
# (ADR D3). Requires an OTLP collector endpoint at runtime.
otel = ["dep:tracing-subscriber", "dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]
# llm-integration: gate live Ollama integration tests.  All tests inside
# tests/llm_integration.rs carry #[cfg(feature = "llm-integration")] + #[ignore]
# so they never run in normal `cargo test` unless explicitly enabled with
# --features llm-integration and -q -- --ignored.
llm-integration = []
# llm-smoke: gate the single golden-path smoke test (Tier 2 of the 3-tier test
# pyramid, ~2 min). Sits between the default mock tier (~30s, no flag) and the
# full llm-integration tier (~30-60 min). It runs the entire consumer journey
# through the public `Memory` facade once. Two run modes share one test body:
#   LIVE   (KREMORY_VCR=record, requires Ollama + gemma4-e2b:latest) — the v0.2.3
#          push gate + cassette refresh path.
#   REPLAY (default, no Ollama) — deterministic CI path via
#          `RecordReplayChatProvider::replay` reading a committed cassette.
# Depends on `test-utils` so `RecordReplayChatProvider` (gated
# `#[cfg(any(test, feature = "test-utils"))]`) resolves from the `tests/` binary —
# integration tests do NOT inherit `#[cfg(test)]`, only feature flags reach them.
llm-smoke = ["test-utils"]
# unstable-graph: RESERVED, NOT YET WIRED. Was planned to gate a v0.1.6
# semantic surface — G3.b (episode_tags junction table + with_tags +
# filter_tag_any/all) and G9 (Memory::get_related graph traversal) — per Vera
# cycle-2 IRREV-002 mitigation. As of 0.5.0 no source in this crate is
# `#[cfg(feature = "unstable-graph")]`; the planned surface never landed under
# this flag. Kept as a placeholder so the eventual wiring is additive.
# See .ai-docs/specs/kremory-v016-api-gaps-aidocs-consumer-2026-05-29.md §3.5.
unstable-graph = []
# unstable-tags: RESERVED, NOT YET WIRED. Was split from unstable-graph per
# Vera cycle-2 NEW-001 to let junction-table tag storage promote to stable
# independently of the higher-risk graph-traversal surface. As of 0.5.0 no
# source in this crate is `#[cfg(feature = "unstable-tags")]`. Kept as a
# placeholder so the eventual wiring is additive.
unstable-tags = []
# content-search: ADR-072 seq1 — BM25/FTS5 content recall over raw
# `episodes.content` (no LLM, no embeddings, no chunker; whole episode is the
# retrievable unit). Gates: Migration 022 (`episodes_fts` external-content FTS5
# virtual table + backfill), the `content_search` query arm (`core::search`),
# the `.content()` recall builder terminal + `ContentPassage` projection, and
# the `episodes_fts` purge-cascade wiring. Off by default — with the feature
# OFF, default build and `.raw()`/`execute()`/entity/fact recall remain
# byte-identical to pre-ADR-072 behaviour (two-lever gating model, ADR-072 §6
# Finding 3; a per-episode runtime `index_content` toggle is a later
# increment, not part of seq1).
#
# TD-066 Increment 1 (`.ai-docs/specs/td-066-recall-scoring-foundation-
# spec-2026-07-21.md` §3): with the feature ON, `.raw()`/`execute()` are NO
# LONGER byte-identical to the feature-off entity/fact-only path by default —
# `core::search::rrf_fuse_with_content` RRF-fuses the content stream in
# automatically (measured +30.2pts judged LoCoMo recall at the REST layer
# this was ported from). This is a deliberate default-behaviour change,
# scoped to when this feature is compiled in; feature-off callers are
# unaffected.
#
# ADR-078 (2026-07-28): PROMOTED TO A DEFAULT FEATURE. The "+30.2pts" noted
# above was measured at the REST layer and recorded here, yet the feature stayed
# off by default — so no `cargo add kremory` consumer ever received it. A direct
# measurement of the real feature-off binary put the gap at **-32.2pt
# ex-adversarial substring on conv0 (64.5% vs 96.7%)**, matching both this
# comment's own number and the independent 40.2%-vs-71.4% LLM-judge figure in
# `kremory-http.rs`'s `SearchMode` doc. It costs zero dependencies, ~1ms of
# recall, and an idempotent pure-SQL backfill (Migration 022) on upgrade.
content-search = []
# rerank: TD-062 (`.ai-docs/specs/td-066-recall-scoring-foundation-
# spec-2026-07-21.md` §3 Increment 3 / §4) — a local BGE cross-encoder
# reranker via `fastembed` for post-fusion precision re-scoring. Off by
# default: `SearchOpts.rerank_k: None` is a no-op with this feature disabled
# OR enabled (opt-in via `Some(n)`), so default recall behaviour is
# unaffected either way — this feature gate exists to keep the ONNX-runtime +
# HF-Hub-download dependency surface (and its network/disk footprint) out of
# builds that never use reranking, mirroring the `ner`/`embeddings` gating
# convention above.
# `dep:ort` added 2026-07-28 (reranker latency lever 2, execution-provider
# spike): `core::rerank` constructs `ort::ep::CoreML::default().build()`
# directly — fastembed re-exports only `ort::execution_providers::
# ExecutionProviderDispatch` (the RESULT type), not the `ort::ep` EP builders
# themselves, so kremory needs its own activated `ort` dependency to build
# one. Same pinned version fastembed already uses (`=2.0.0-rc.12`) — no new
# version, no conflict; `ort`'s own `features = ["ndarray"]` in this Cargo.toml
# is unconditional regardless of which feature activates `dep:ort`.
rerank = ["dep:fastembed", "dep:ort"]

[lib]
name = "kremory"
path = "src/lib.rs"

# TD-062 mandatory Phase-0 spike (spec §5.2) — `required-features` so
# `--all-targets` on a build WITHOUT the `rerank` feature skips this example
# instead of failing to compile (the example imports `fastembed` directly,
# which doesn't exist as a dependency without the feature).
[[example]]
name = "fastembed_rerank_spike"
required-features = ["rerank"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# schemars 1.2.1: JSON Schema generation from #[derive(JsonSchema)] for structured-output enforcement.
# Used by extraction parse-target structs + schemas module (Phase 2–3 of TD-012).
schemars = "1.2.1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = "1"
# tokio: use full feature set (superset of rqlm's macros + rt-multi-thread)
tokio = { version = "1", features = ["full"] }
# tokio-util: CancellationToken for DreamScheduler graceful shutdown (C10/C11)
tokio-util = { version = "0.7", features = ["rt"] }
anyhow = "1"
thiserror = "2"
# base64: faithful transport of the entities.embedding BLOB through the
# graph_mutation_log.pre_state JSON snapshot (reversible-graph-mutations §2.3).
# Already resolved transitively at 0.22.1 — no new lockfile entry.
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.7"
# TD-232/TD-234: caller-facing pre-chunking helper (kremory::split_for_embedding).
# Kremory does not chunk content on the caller's behalf for storage/retrieval
# (a locked architectural boundary — see the module doc comment); this is the
# tool for callers who want to respect that boundary without hand-rolling
# unicode-aware sentence-boundary splitting themselves. Evaluated before
# adopting (Rule 33): 2M+ all-time / 619K 90-day downloads, MIT, actively
# maintained (published 2026-06-16, not yanked). Base feature only — no
# tokenizer/markdown/tree-sitter extras, character-count sizing to match
# `episode_content_warn_threshold`'s own convention.
text-splitter = "0.32"
# libSQL: native vectors (F32_BLOB + DiskANN) + FTS5 + SQL. Replaces rusqlite + sqlite-vec.
# PIN per Vera cycle-2 RISK-002 (2026-05-29): 0.10.0-pre.2 shipped 2026-05-27;
# Turso migrating effort to from-scratch `tursodatabase/turso` crate; libsql-server
# stalled since Feb 2025. Pin = avoids resolver instability. Revisit at v0.2.0
# when backend ADR (libsql vs CozoDB vs Turso new crate) is evaluated.
libsql = "=0.9.30"
# BYOM invariant: autoagents-llm trait only — never concrete impl.
# Required (not optional) because kremory::memory::GraphHandle uses ChatProvider.
# Provider features: ollama / openai / anthropic enable the concrete backend builders
# used by the Tier 1 shortcuts (Memory::with_ollama, etc.). Still autoagents-llm
# only — no autoagents-llamacpp pulled in (BYOM gate G4 remains satisfied).
autoagents-llm = { version = "0.3", features = ["ollama", "openai", "anthropic"] }
futures = "0.3"
async-trait = "0.1"
# TD-192: replaced `llm_json` 1.0.3 (2026-08-07). MEASURED, not preference —
# `llm_json::repair_json` FLATTENS ARRAYS: for any input it must recover rather
# than parse cleanly it returns only the FIRST value. 9 of 9 non-clean shapes
# tested (fenced, ~~~-fenced, prose-prefixed, prose-suffixed, brackets-in-string,
# and three realistic TRUNCATION shapes) collapsed a 2-element array to one
# object, silently, returning Ok. `jsonrepair` flattens 0 of 9 and fails LOUDLY
# on the one shape it cannot recover. It also cuts unique transitive deps 25 -> 14,
# dropping a `clap` + ANSI-terminal chain that has no place in a library tree.
# Spike table + verdict: register TD-192 / RECALL-LEDGER 4.18.
# RISK ACCEPTED: jsonrepair is 0.1.0 (Oct 2025, ~52k downloads). The incumbent
# had an active silent-data-loss defect, and `extract_first_balanced_value`
# (structured.rs) still bounds the span before this crate is consulted, so a
# regression here degrades to the behaviour we already had, not worse.
jsonrepair = "0.1.0"
metrics = "0.24"
tracing = "0.1"
# runtime parsing of provider-rates.toml override path
toml = "0.8"
# OTel optional deps — only pulled in with `otel` feature (ADR D3)
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
opentelemetry = { version = "0.27", optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
# P4 arena allocator — per-episode bump allocation (B.1 / A.0 K7=PASS).
bumpalo = "3.20.2"
# SHA-256 content hash for insert-level dedup (Story #209)
sha2 = "0.10"
# regex: prompt-injection sanitizer patterns (T1.4 — basket #68)
regex = "1"
zspell = "0.5"
stop-words = "0.8"
unicode-segmentation = "1.11"
# DashMap: concurrent in-memory registries for EngineGraphHandle (ingest_runs, batch_status, etc.)
dashmap = "6"
# LRU cache for NamespacePolicyCache (ADR-029b Decision 4)
lru = "0.12"
# `coreml` added 2026-07-28 (reranker latency lever 2, execution-provider
# spike): required for `ort::ep::CoreML` to actually REGISTER at runtime —
# verified empirically that without it, `SessionBuilder::with_execution_providers`
# logs `ort::ep WARN: Couldn't register CoreMLExecutionProvider: ... its
# corresponding Cargo feature is not enabled` and silently falls back to CPU
# (never errors the session — same fallback-chain behaviour either way, this
# feature just makes the CoreML arm of `KREMORY_RERANK_EXECUTION_PROVIDER`
# non-dead). `ort`'s prebuilt downloaded ONNX Runtime dylib already bundles
# CoreML support on macOS; this feature only unlocks the Rust-side call.
ort = { version = "=2.0.0-rc.12", features = ["ndarray", "coreml"], optional = true }
ndarray = { version = "0.17", optional = true }
tokenizers = { version = "0.23", optional = true }
hf-hub = { version = "0.5", optional = true }
# fastembed pins the SAME `ort = "=2.0.0-rc.12"` this crate already pins for
# `ner`/`embeddings` (verified: no version conflict, spec §4 dry-run). Default
# features off — `image-models` (the `image` crate + av1/webp/png/tiff codec
# tree) is only needed for fastembed's image-embedding models; `TextRerank`
# never touches it. Keep `ort-download-binaries-native-tls` +
# `hf-hub-native-tls` (fastembed's OWN default minus `image-models`) so the
# ONNX runtime + model weights still download automatically, matching
# fastembed's documented zero-config path.
fastembed = { version = "5.17.3", optional = true, default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

[dev-dependencies]
metrics-util = "0.18"
# Per-test tracing harness (v0.2.4 Component 3, init_test_log). Wired as
# dev-deps — NOT through the `otel` feature — so the helper compiles for every
# test tier (default mocks too), not just OTLP-enabled builds. `tracing-subscriber`
# is otherwise an optional production dep gated behind `otel`; dev-deps are a
# separate edge that reaches the `tests/` integration binaries. Do NOT enable the
# `otel` feature to obtain the subscriber — that pulls the full OTLP stack.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
# `no-env-filter` is required for integration tests (in `tests/`) to capture
# events that target custom names like `kremory.namespace` (ADR-029a). Without
# this feature `tracing-test`'s default env filter only matches the test-binary
# crate name.
tracing-test = { version = "0.2", features = ["no-env-filter"] }
tokio = { version = "1", features = ["full", "test-util"] }
zspell = "0.5"
stop-words = "0.8"
unicode-segmentation = "1.11"
# BYOM invariant: kremory MUST NOT depend on `autoagents-llamacpp` as a dev-dep.
# The trait surface (autoagents-llm) is the only LLM crate kremory touches;
# downstream consumers wire the concrete impl.
# ollama feature: enables autoagents_llm::backends::ollama for LLM integration tests.
autoagents-llm = { version = "0.3", features = ["ollama"] }
anyhow = "1"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
# Enable test-utils feature for integration tests so Mock*/Stub* types are
# visible to the tests/ directory (integration tests are separate binaries
# and do NOT inherit #[cfg(test)] from the library — only feature flags work).
kremory = { path = ".", features = ["test-utils"] }
# tempfile: isolated SQLite per LLM integration test (avoids cross-test state).
tempfile = "3"
# proptest: property-based testing for RRF dedup invariants, serde round-trips,
# and overflow protection (ADR-029b + ADR-029c 5-tier pyramid, Phase A).
proptest = "1"

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
too_many_arguments = "warn"
