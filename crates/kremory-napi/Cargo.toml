[package]
name = "kremory-napi"
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
license = "Apache-2.0"
description = "Node.js (napi-rs) binding for kremory agent memory"
repository = "https://github.com/kgentic/kremory"

[lib]
# Both crate types needed: cdylib = Node.js .node binary, rlib = `cargo test`
# integration tests (tests/*.rs cannot import a cdylib-only crate).
# Standard pattern for napi-rs/PyO3 FFI crates — see PyO3 FAQ and napi-rs docs.
crate-type = ["cdylib", "rlib"]

[features]
# NEW-003 cycle-2 fix: an explicit `default` prevents `--all-features` CI builds
# from silently enabling unstable surfaces — consumers must still opt in to
# unstable-graph / unstable-tags / ner.
#
# ADR-078 (2026-07-28): no longer EMPTY. `content-search` is a default here for
# the same reason as in the substrate, plus one specific to this crate: until
# 2026-07-28 the binding had NO passthrough for it at all, so Node consumers
# (aidocs, the TS MCP server) were locked to entity/fact-only recall with no
# opt-in available — a Rule-16 surface-parity gap on the Cargo-feature axis.
default = ["content-search"]

# unstable-graph: passes through to substrate. Gates B11 (JsMemory.getRelated).
# Mirrors substrate `kremory/unstable-graph` per Vera cycle-2 IRREV-002 mitigation.
# See .ai-docs/specs/kremory-napi-v016-surface-expansion-2026-05-29.md §10.
unstable-graph = ["kremory/unstable-graph"]

# ner: passes through to substrate. Enables `JsOpenOptions.extractor: 'hybrid'`
# (TD-023 hybrid GLiNER + 1-LLM-typing-call extractor). When off, requesting
# 'hybrid' returns a typed napi error `KremoryError::FeatureDisabled('ner')`.
# Aidocs distribution builds with this feature ON by default.
# See .ai-docs/specs/kremory-v017-hybrid-extractor-production-wire-in-spec-2026-06-04.md §4.3.
ner = ["kremory/ner"]

# unstable-tags: split from unstable-graph per Vera cycle-2 NEW-001. Gates
# B1.b (JsEpisodeDraft.tags + JsRecallOptions.filterTagAny/All). Consumers can
# adopt indexed tag filtering without opting into the higher-risk CTE graph
# surface. Mirrors substrate `kremory/unstable-tags`.
unstable-tags = ["kremory/unstable-tags"]

# content-search: passes through to substrate ADR-072. NOT merely an extra API
# surface — this is the load-bearing correction of ADR-078. The substrate gates
# THREE things behind it: the BM25 content arm, the dense episode arm (the whole
# `fuse_content_stream` fn is content-search-gated, `facade/recall.rs`), and
# Migrations 022 + 026 (so a feature-off DB has neither `episodes_fts` nor
# `episodes.embedding`). Without this passthrough a Node consumer could not
# reach ANY of it — `recall()` was entity/fact-only with no opt-in available,
# which is why every LoCoMo number the project publishes was unreachable from
# the binding. Adding it needs no new JS API: the fusion happens inside the
# ordinary `recall()` path.
content-search = ["kremory/content-search"]

# rerank: passes through to substrate TD-062's cross-encoder. Unlike
# `content-search` this ALSO needs a JS-visible knob to have any effect —
# `SearchOpts::rerank_k` defaults to `None`, so the feature alone is inert.
# Paired with `RecallOptions.rerankK` (convert.rs), which closes the
# `SearchOpts::rerank_k` parity-skip entry.
rerank = ["kremory/rerank"]

[dependencies]
kremory = { path = "../kremory" }
# Direct dep required for resolve_env_llm (ADR-030 Tier-2 BYOM bridge).
# Provides LLMBuilder + backend types (Ollama/OpenAI/Anthropic) to env-detect
# the LLM when the caller supplies a custom JS embedder. kremory::facade::providers
# does not expose an LLM-only detection function, so kremory-napi must construct
# providers directly. The workspace [patch.crates-io] redirects this to the
# kgentic fork (feat/chat-provider-model-accessor), matching kremory's own dep.
# Same version + features as kremory itself uses for Tier-1 shortcuts.
autoagents-llm = { version = "0.3", features = ["ollama", "openai", "anthropic"] }
# napi-rs v3 migration spike output saved at .ai-docs/research/... — recipe ready
# when napi work resumes post-substrate-v0.1.6. v2 pins held for now so the
# v0.1.5 binding (currently shipped + working) doesn't regress. Substrate work
# precedes binding parity (per feedback_substrate_first_then_binding_parity).
napi = { version = "2", features = ["async", "napi4", "tokio_rt", "serde-json"] }
napi-derive = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# ADR-031 Layer 3 parity test — syn parses substrate + napi source files.
syn = { version = "2", features = ["full", "parsing"] }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
quote = "1"
# ADR-074 review H2 — `convert::tests` needs a minimal `kremory::ChatProvider`
# stub (a real `Arc<dyn ChatProvider>` is required to build a `Memory`, even
# on the `skip_extraction()` pinned-fact path that never calls it). Mirrors
# kremory's own `#[async_trait::async_trait] impl ChatProvider` pattern
# (`crates/kremory/src/core/provider/chat.rs`); already resolved transitively
# via `kremory`/`autoagents-llm`, so this adds no new download.
async-trait = "0.1"

[build-dependencies]
napi-build = "2"

[lints.rust]
warnings = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
