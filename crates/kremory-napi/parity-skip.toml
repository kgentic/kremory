# ── B10 substrate gap — EnrichmentEventSink binding ──────────────────────────
#
# JsOpenOptions.sink is specified in B10 but cannot be wired because:
# 1. Memory::auto() does not accept an event sink (no post-construction setter)
# 2. Provider builder types (LLMBuilder, EmbeddingBuilder) are not in kremory's
#    public API — the binding cannot replicate auto()'s env-detection logic.
# Resolution: substrate needs Memory::auto_with_sink() or pub set_event_sink().
# Tracked in MemoryBuilder::with_event_sink skip entry above.

