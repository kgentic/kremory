[package]
name = "kremory-eval"
version = "0.0.1"
edition = "2021"
publish = false                         # CRITICAL — never published to crates.io
description = "Internal quality evaluation harness for kremory (not published)"

[dependencies]
kremory = { path = "../kremory" }
autoagents-llamacpp = "0.3.7"
autoagents-llm = "0.3.7"
metrics-util = "0.18"
hf-hub = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }

[[bin]]
name = "calibration_spike"
path = "src/bin/calibration_spike.rs"

[[bin]]
name = "entity_extraction_baseline"
path = "src/bin/entity_extraction_baseline.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dev-dependencies]
# Enable test-utils feature so MockChatProvider + NullEmbeddingProvider are
# visible in integration tests (tests/ are separate binaries; cfg(test) does
# not propagate — feature flag is the only mechanism).
kremory = { path = "../kremory", features = ["test-utils"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
