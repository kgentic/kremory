[package]
name = "kremory-eval"
version = "0.0.1"
edition = "2021"
publish = false                         # CRITICAL — never published to crates.io
description = "Internal quality evaluation harness for kremory (not published)"

[dependencies]
kremory = { path = "../kremory" }
autoagents-llamacpp = "0.3.7"
autoagents-llm = "0.3.7"
metrics = "0.24"
metrics-util = "0.18"
hf-hub = { version = "0.3", features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3"
libsql = "=0.9.30"
reqwest = { version = "0.12", features = ["json"] }

[[bin]]
name = "calibration_spike"
path = "src/bin/calibration_spike.rs"

[[bin]]
name = "entity_extraction_baseline"
path = "src/bin/entity_extraction_baseline.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[[bin]]
name = "consistency_check_sweep"
path = "src/bin/consistency_check_sweep.rs"

[[bin]]
name = "spike_c6_async_gate"
path = "src/bin/spike_c6_async_gate.rs"

# O11y Sprint O0.1 — Phase 1 NER standalone benchmark closes ADR-049 §5.5 GAP-001
# (<100ms p50 hot-path measurement that the spike binary couldn't isolate).
[[bin]]
name = "phase1_ner_bench"
path = "src/bin/phase1_ner_bench.rs"
required-features = ["ner"]

# O11y Sprint O0.3 — LLM tokens-per-second benchmark via direct Ollama API.
# autoagents-llm's ChatProvider trait doesn't surface eval_count; this bypasses it.
[[bin]]
name = "llm_tokens_bench"
path = "src/bin/llm_tokens_bench.rs"

[features]
# Passthrough so `phase1_ner_bench` can gate on kremory's `ner` feature.
ner = ["kremory/ner"]

[dev-dependencies]
# Enable test-utils feature so MockChatProvider + NullEmbeddingProvider are
# visible in integration tests (tests/ are separate binaries; cfg(test) does
# not propagate — feature flag is the only mechanism).
kremory = { path = "../kremory", features = ["test-utils"] }
# Needed by bin/eval.rs cfg(test) tests that implement
# autoagents_llm::embedding::EmbeddingProvider (async-fn-in-trait surface).
async-trait = "0.1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
